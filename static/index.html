<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOST Search</title>
<style>
  :root {
    --bg: #0e1116; --bg-raise: #161b22; --border: #262d36; --text: #e6edf3;
    --muted: #8b949e; --accent: #7ee0ff; --accent2: #a78bfa; --link: #8ab4f8;
    --mark: rgba(127, 224, 255, .22); --skel: #1c232d; --shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  html[data-theme="light"] {
    --bg: #ffffff; --bg-raise: #f6f8fa; --border: #d8dee4; --text: #1f2328;
    --muted: #59636e; --accent: #0969da; --accent2: #8250df; --link: #0b57d0;
    --mark: #fff3cd; --skel: #eaeef2; --shadow: 0 8px 30px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); transition: background .25s, color .25s;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---------- search box ---------- */
  .searchbox { position: relative; width: 100%; }
  .searchbox input {
    width: 100%; padding: 14px 52px 14px 22px; font-size: 16px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 26px; outline: none;
    transition: box-shadow .15s, border-color .15s;
  }
  .searchbox input:focus { box-shadow: var(--shadow); border-color: transparent; }
  .searchbox .iconbtn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: none; background: transparent; cursor: pointer; padding: 8px; border-radius: 50%;
    color: var(--accent); display: grid; place-items: center;
  }
  .searchbox .iconbtn:hover { background: var(--bg-raise); }
  .searchbox svg { width: 20px; height: 20px; fill: currentColor; }
  .suggest {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40;
    background: var(--bg-raise); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden; display: none;
  }
  .suggest div { padding: 10px 22px; cursor: pointer; font-size: 14px; }
  .suggest div:hover, .suggest div.active { background: var(--skel); }

  /* ---------- landing ---------- */
  #landing {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px; padding: 24px;
  }
  #landing .wrap { width: min(580px, 92vw); display: flex; flex-direction: column; gap: 22px; align-items: center; }
  .logo { display: flex; align-items: center; gap: 12px; user-select: none; cursor: pointer; }
  .logo svg { width: 46px; height: 46px; }
  .logo .word {
    font-size: 44px; font-weight: 800; letter-spacing: 4px;
    background: linear-gradient(100deg, var(--accent) 10%, var(--accent2) 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline { color: var(--muted); font-size: 13px; letter-spacing: .4px; }
  .btnrow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .gbtn {
    padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-raise); color: var(--text); font-size: 14px; cursor: pointer;
  }
  .gbtn:hover { border-color: var(--accent); }
  .gbtn.primary { background: linear-gradient(100deg, var(--accent), var(--accent2)); border: none; color: #08131c; font-weight: 600; }
  .stats { color: var(--muted); font-size: 13px; }
  #themeToggle {
    position: fixed; top: 16px; right: 16px; z-index: 60; border: 1px solid var(--border);
    background: var(--bg-raise); color: var(--text); border-radius: 50%; width: 40px; height: 40px;
    cursor: pointer; font-size: 17px; display: grid; place-items: center;
  }

  /* ---------- results chrome ---------- */
  #results { display: none; min-height: 100vh; }
  header.bar {
    display: flex; align-items: center; gap: 22px; padding: 12px 28px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap; position: sticky; top: 0;
    background: var(--bg); z-index: 30;
  }
  header.bar .logo svg { width: 30px; height: 30px; }
  header.bar .logo .word { font-size: 24px; letter-spacing: 3px; }
  header.bar .searchbox { flex: 1; min-width: 260px; max-width: 620px; }
  header.bar .searchbox input { padding: 10px 46px 10px 18px; font-size: 15px; }
  #tabs { display: flex; gap: 4px; padding: 0 28px; border-bottom: 1px solid var(--border); }
  #tabs button {
    position: relative; background: none; border: none; color: var(--muted);
    padding: 12px 18px; font-size: 14px; cursor: pointer;
  }
  #tabs button[aria-selected="true"] { color: var(--accent); font-weight: 600; }
  #tabs button::after {
    content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 3px;
    border-radius: 3px 3px 0 0; background: var(--accent);
    transform: scaleX(0); transition: transform .2s ease;
  }
  #tabs button[aria-selected="true"]::after { transform: scaleX(1); }
  #tabs .srcwrap { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 6px 0; }
  #tabs .srcwrap label { color: var(--muted); font-size: 14px; }
  #tabs .srcwrap select {
    background: var(--bg-raise); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; font-size: 12px; cursor: pointer;
  }
  #meta { padding: 12px 30px; color: var(--muted); font-size: 13px; }
  #meta .dym { color: var(--accent2); cursor: pointer; }
  main { max-width: 700px; padding: 8px 30px 60px; }

  /* ---------- web results ---------- */
  .hit { margin-bottom: 30px; }
  .hit .crumb { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; font-size: 13px; color: var(--muted); }
  .hit .fav { width: 18px; height: 18px; border-radius: 50%; background: var(--bg-raise); display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--accent2); overflow: hidden; flex: none; }
  .hit .fav img { width: 14px; height: 14px; border-radius: 3px; }
  .hit .crumb .site { color: var(--text); }
  .livebadge {
    font-size: 10px; color: var(--accent2); border: 1px solid var(--accent2);
    border-radius: 8px; padding: 1px 7px; white-space: nowrap; opacity: .85;
  }
  .hit a.title { font-size: 19px; line-height: 1.3; }
  .hit .snippet { font-size: 14px; color: var(--muted); line-height: 1.6; margin-top: 5px; white-space: pre-line; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* ---------- image / video grids ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .card { background: var(--bg-raise); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .15s; }
  .card:hover { transform: translateY(-2px); }
  .card img { width: 100%; height: 150px; object-fit: cover; display: block; background: var(--skel); }
  .card .cap { padding: 8px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .badge { position: relative; }
  .card .badge span { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.65); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 8px; }
  .card .dur { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.65); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 6px; }
  .vthumb { position: relative; height: 150px; background: linear-gradient(120deg, var(--skel), var(--bg-raise)); display: grid; place-items: center; color: var(--accent); font-size: 30px; }
  .vthumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* ---------- lightbox ---------- */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 30px;
  }
  #lightbox .inner { max-width: min(1000px, 92vw); display: flex; flex-direction: column; gap: 12px; }
  #lightbox img { max-width: 100%; max-height: 74vh; border-radius: 10px; margin: 0 auto; display: block; }
  #lightbox .cap { color: #e6edf3; font-size: 14px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center; }
  #lightbox .close {
    position: absolute; top: 14px; right: 18px; background: rgba(255,255,255,.1); color: #fff;
    border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer;
  }

  /* ---------- skeletons / empty / pager ---------- */
  .skel { margin-bottom: 30px; }
  .skel .l1 { height: 13px; width: 40%; border-radius: 6px; background: var(--skel); margin-bottom: 10px; }
  .skel .l2 { height: 20px; width: 70%; border-radius: 6px; background: var(--skel); margin-bottom: 10px; }
  .skel .l3 { height: 13px; width: 95%; border-radius: 6px; background: var(--skel); }
  .skel > div { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .empty { padding: 70px 20px; text-align: center; color: var(--muted); }
  .empty .ghost { font-size: 46px; display: block; margin-bottom: 14px; }
  .empty .dym2 { margin-top: 12px; }
  #pager { display: flex; gap: 8px; margin: 26px 0 10px; align-items: center; justify-content: center; font-size: 14px; flex-wrap: wrap; }
  #pager button {
    min-width: 38px; height: 38px; border: 1px solid var(--border); background: var(--bg);
    padding: 0 12px; border-radius: 19px; cursor: pointer; color: var(--text);
  }
  #pager button[aria-current="true"] { background: var(--bg-raise); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  #pager button:disabled { opacity: .4; cursor: default; }

  /* ---------- crawl admin ---------- */
  details.admin {
    position: fixed; right: 16px; bottom: 16px; width: min(430px, 92vw);
    background: var(--bg-raise); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); padding: 14px 16px; font-size: 14px; z-index: 50;
  }
  details.admin summary { cursor: pointer; color: var(--muted); user-select: none; }
  details.admin label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 12px; }
  details.admin textarea, details.admin input[type="text"] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; font-family: inherit; background: var(--bg); color: var(--text);
  }
  details.admin textarea { height: 64px; resize: vertical; }
  details.admin .row { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  details.admin button.go {
    background: linear-gradient(100deg, var(--accent), var(--accent2)); color: #08131c; border: none;
    border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  details.admin button.go:disabled { opacity: .5; cursor: wait; }
  #crawlStatus { font-size: 12px; color: var(--muted); }

  @media (max-width: 640px) {
    header.bar { gap: 12px; padding: 10px 16px; }
    main { padding: 8px 16px 60px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .card img, .vthumb { height: 110px; }
  }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">☾</button>

<!-- ================= landing ================= -->
<div id="landing">
  <div class="wrap">
    <div class="logo" onclick="goHome()" aria-label="GHOST Search home">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7ee0ff"/><stop offset="1" stop-color="#a78bfa"/>
        </linearGradient></defs>
        <path fill="url(#lg)" d="M32 6C19.8 6 10 15.8 10 28v28l7-6 7 6 8-6 8 6 7-6 7 6V28C54 15.8 44.2 6 32 6zm-9 26a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm18 0a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
      </svg>
      <span class="word">GHOST</span>
    </div>
    <div class="tagline">haunt the web — a self-hosted, no-AI search engine</div>
    <div class="searchbox">
      <input id="q1" type="text" placeholder="Search the spectral index…" autocomplete="off"
             aria-label="Search" autofocus>
      <button class="iconbtn" id="go1" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
      <div id="sug1" class="suggest" role="listbox"></div>
    </div>
    <div class="btnrow">
      <button class="gbtn primary" id="lucky">I'm Feeling Lucky</button>
      <button class="gbtn" onclick="doSearch(q1.value)">GHOST Search</button>
    </div>
    <div class="stats" id="statsLanding" aria-live="polite"></div>
  </div>
</div>

<!-- ================= results ================= -->
<div id="results">
  <header class="bar">
    <div class="logo" onclick="goHome()" aria-label="GHOST home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path fill="url(#lg)" d="M32 6C19.8 6 10 15.8 10 28v28l7-6 7 6 8-6 8 6 7-6 7 6V28C54 15.8 44.2 6 32 6zm-9 26a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm18 0a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
      <span class="word">GHOST</span>
    </div>
    <div class="searchbox">
      <input id="q2" type="text" autocomplete="off" aria-label="Search">
      <button class="iconbtn" id="go2" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
      <div id="sug2" class="suggest" role="listbox"></div>
    </div>
  </header>
  <div id="tabs" role="tablist" aria-label="Result types">
    <button role="tab" data-type="web" aria-selected="true">All</button>
    <button role="tab" data-type="images" aria-selected="false">Images</button>
    <button role="tab" data-type="videos" aria-selected="false">Videos</button>
    <span class="srcwrap">
      <label for="srcSel" aria-label="Result source">🌐</label>
      <select id="srcSel" aria-label="Result source">
        <option value="auto">Auto (local + live)</option>
        <option value="local">Local index only</option>
        <option value="live">Live web only</option>
      </select>
    </span>
  </div>
  <div id="meta" aria-live="polite"></div>
  <main id="pane"></main>
</div>

<!-- lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
  <button class="close" id="lbClose" aria-label="Close preview">✕</button>
  <div class="inner">
    <img id="lbImg" alt="">
    <div class="cap">
      <span id="lbAlt"></span>
      <a id="lbLink" target="_blank" rel="noopener">Visit page ↗</a>
    </div>
  </div>
</div>

<!-- crawl admin -->
<details class="admin">
  <summary>⚙︎ Crawl &amp; index</summary>
  <label for="seeds">Seed URLs (one per line)</label>
  <textarea id="seeds" placeholder="https://en.wikipedia.org/wiki/Search_engine&#10;https://docs.python.org/3/"></textarea>
  <label for="maxPages">Max pages: <span id="maxVal">100</span></label>
  <input id="maxPages" type="range" min="10" max="500" step="10" value="100" aria-label="Max pages">
  <div class="row">
    <label style="margin:0"><input type="checkbox" id="allowExternal"> external links</label>
    <label style="margin:0"><input type="checkbox" id="forceRefresh"> refresh all</label>
  </div>
  <div class="row">
    <button class="go" id="crawlBtn">Start crawl</button>
    <span id="crawlStatus" aria-live="polite"></span>
  </div>
</details>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const terms = (q) => q.toLowerCase().split(/\W+/).filter(t => t.length > 1);
const highlight = (s, q) => {
  let out = esc(s);
  for (const t of new Set(terms(q))) {
    out = out.replace(new RegExp("\\b(" + t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\w*)", "gi"), "<mark>$1</mark>");
  }
  return out;
};
const faviconOf = (url, stored) =>
  stored ? esc(stored)
         : "https://www.google.com/s2/favicons?sz=32&domain=" + encodeURIComponent(new URL(url).hostname);
const durFmt = (s) => !s ? "" : `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

/* ---------- theme ---------- */
const themeBtn = $("themeToggle");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☾" : "☀";
  localStorage.setItem("ghost-theme", t);
}
applyTheme(localStorage.getItem("ghost-theme") || "dark");
themeBtn.onclick = () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

let state = { query: "", type: "web", page: 1 };
let lastData = null;
const srcSel = $("srcSel");
srcSel.value = localStorage.getItem("ghost-src") || "auto";
srcSel.addEventListener("change", () => {
  localStorage.setItem("ghost-src", srcSel.value);
  if (state.query) doSearch(state.query, state.type, 1);
});

/* ---------- stats ---------- */
async function loadStats() {
  const r = await fetch("/api/stats").then(r => r.json()).catch(() => null);
  if (!r) return;
  $("statsLanding").textContent =
    `${r.documents_indexed.toLocaleString()} pages · ${r.images.toLocaleString()} images · ` +
    `${r.videos.toLocaleString()} videos · ${r.db_size_mb} MB index`;
}

/* ---------- skeletons ---------- */
const SKELETONS = `
  ${'<div class="skel"><div class="l1"></div><div class="l2"></div><div class="l3"></div></div>'.repeat(5)}`;

/* ---------- search ---------- */
async function doSearch(q, type = state.type, page = 1) {
  q = (q || "").trim();
  if (!q) return;
  state = { query: q, type, page };
  $("q1").value = q; $("q2").value = q;
  $("landing").style.display = "none";
  $("results").style.display = "block";
  document.querySelectorAll("#tabs button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.type === type)));
  $("meta").textContent = "Searching…";
  $("pane").innerHTML = type === "web" ? SKELETONS
    : `<div class="grid">${'<div class="skel" style="margin:0"><div class="l3" style="height:150px"></div></div>'.repeat(8)}</div>`;
  window.scrollTo(0, 0);

  const url = `/api/search?q=${encodeURIComponent(q)}&type=${type}&page=${page}&source=${srcSel.value}`;
  const r = await fetch(url).then(r => r.json()).catch(() => null);
  if (!r) { $("meta").textContent = "Search failed — is the server running?"; $("pane").innerHTML = ""; return; }
  lastData = r;

  const secs = (r.took_ms / 1000).toFixed(2);
  let dym = "";
  if (r.did_you_mean) {
    dym = `Did you mean: <span class="dym" role="button" tabindex="0" onclick="doSearch(${JSON.stringify(r.did_you_mean).replace(/"/g,"&quot;")})">${esc(r.did_you_mean)}</span> · `;
  }
  const liveNote = r.live_count > 0
    ? ` · <span title="These results come from the live web (DuckDuckGo), blended with your local index">${r.live_count} from the live web 🌐</span>`
    : "";
  $("meta").innerHTML = `${dym}About ${r.total.toLocaleString()} result${r.total === 1 ? "" : "s"} (${secs} seconds)${liveNote}`;

  if (type === "web") renderWeb(r);
  else if (type === "images") renderImages(r);
  else renderVideos(r);
}

function renderWeb(r) {
  if (!r.results.length) { renderEmpty(r); return; }
  $("pane").innerHTML = r.results.map((h, i) => `
    <div class="hit">
      <div class="crumb">
        <span class="fav" aria-hidden="true"><img src="${faviconOf(h.url, h.favicon)}" alt=""
          onerror="this.parentNode.textContent='${esc((h.display_url || new URL(h.url).hostname)[0] ? (h.display_url || new URL(h.url).hostname)[0].toUpperCase() : "?")}'"></span>
        <span class="site">${esc(h.display_url || h.url)}</span>
        ${h.source === "live" ? '<span class="livebadge">🌐 live</span>' : ""}
      </div>
      <a class="title" href="${esc(h.url)}" target="_blank" rel="noopener"
         onclick="logClick(${i})">${highlight(h.title, r.query)}</a>
      <div class="snippet">${highlight(h.snippet, r.query)}</div>
    </div>`).join("");

  const totalPages = Math.min(20, Math.max(1, Math.ceil(r.total / r.per_page)));
  const cur = r.page;
  const nums = [];
  for (let p = Math.max(1, cur - 2); p <= Math.min(totalPages, cur + 2); p++) nums.push(p);
  $("pane").insertAdjacentHTML("beforeend", `
    <nav id="pager" aria-label="Pagination">
      <button ${cur <= 1 ? "disabled" : ""} aria-label="Previous page" onclick="doSearch(state.query,'web',${cur-1})">&#8592;</button>
      ${nums.map(p => `<button aria-current="${p===cur}" onclick="doSearch(state.query,'web',${p})">${p}</button>`).join("")}
      <button ${cur >= totalPages ? "disabled" : ""} aria-label="Next page" onclick="doSearch(state.query,'web',${cur+1})">&#8594;</button>
    </nav>`);
}

function renderImages(r) {
  if (!r.results.length) { renderEmpty(r); return; }
  $("pane").innerHTML = `<div class="grid">` + r.results.map(im => `
    <div class="card" role="button" tabindex="0" aria-label="${esc(im.alt || "image")}"
         onclick="openLightbox(${JSON.stringify(im).replace(/"/g,"&quot;")})"
         onkeydown="if(event.key==='Enter')openLightbox(${JSON.stringify(im).replace(/"/g,"&quot;")})">
      <img loading="lazy" src="${esc(im.thumbnail || im.src)}" alt="${esc(im.alt)}"
           onerror="this.style.visibility='hidden'">
      <div class="cap">${esc(im.alt || new URL(im.page_url).hostname)}${im.source === "live" ? " 🌐" : ""}</div>
    </div>`).join("") + `</div>`;
}

function renderVideos(r) {
  if (!r.results.length) { renderEmpty(r); return; }
  $("pane").innerHTML = `<div class="grid">` + r.results.map(v => `
    <a class="card" href="${esc(v.src)}" target="_blank" rel="noopener" style="display:block">
      <div class="vthumb">
        ${v.thumbnail ? `<img loading="lazy" src="${esc(v.thumbnail)}" alt="" onerror="this.remove()">` : "▶"}
        <span class="badge"><span>${esc(v.kind)}</span></span>
        ${v.duration ? `<span class="dur">${durFmt(v.duration)}</span>` : ""}
      </div>
      <div class="cap" title="${esc(v.title)}">${esc(v.title)}</div>
    </a>`).join("") + `</div>`;
}

function renderEmpty(r) {
  const dym = r.did_you_mean
    ? `<div class="dym2">Did you mean <a href="#" onclick="doSearch(${JSON.stringify(r.did_you_mean).replace(/"/g,"&quot;")});return false"><b>${esc(r.did_you_mean)}</b></a>?</div>`
    : "";
  $("pane").innerHTML = `
    <div class="empty">
      <span class="ghost" aria-hidden="true">👻</span>
      <p>Your index is silent on <b>${esc(r.query)}</b>.<br>Crawl more pages from the ⚙︎ panel, or try different words.</p>
      ${dym}
    </div>`;
}

/* ---------- lightbox ---------- */
function openLightbox(im) {
  $("lbImg").src = im.src;
  $("lbImg").alt = im.alt || "";
  $("lbAlt").textContent = im.alt || im.page_url;
  $("lbLink").href = im.page_url;
  $("lightbox").style.display = "flex";
  $("lbClose").focus();
}
function closeLightbox() { $("lightbox").style.display = "none"; }
$("lbClose").onclick = closeLightbox;
$("lightbox").addEventListener("click", (e) => { if (e.target === $("lightbox")) closeLightbox(); });

/* ---------- click logging ---------- */
function logClick(position) {
  if (!lastData) return;
  const h = lastData.results[position];
  if (!h) return;
  const body = JSON.stringify({ query: state.query, url: h.url, position });
  try { navigator.sendBeacon("/api/click", new Blob([body], { type: "application/json" })); }
  catch { fetch("/api/click", { method: "POST", headers: { "Content-Type": "application/json" }, body, keepalive: true }); }
}

/* ---------- feeling lucky ---------- */
$("lucky").onclick = async () => {
  const q = $("q1").value.trim();
  if (!q) { $("q1").focus(); return; }
  const r = await fetch(`/api/search?q=${encodeURIComponent(q)}&type=web`).then(x => x.json()).catch(() => null);
  if (r && r.results.length) {
    const h = r.results[0];
    logClick(0);
    window.open(h.url, "_blank", "noopener");
  } else doSearch(q);
};

/* ---------- tabs / home ---------- */
document.querySelectorAll("#tabs button").forEach(b =>
  b.addEventListener("click", () => doSearch(state.query || $("q2").value, b.dataset.type, 1)));
function goHome() {
  $("results").style.display = "none";
  $("landing").style.display = "flex";
  $("q1").focus();
}

/* ---------- autocomplete (debounced, arrow-navigable) ---------- */
let sugTimer = null, sugIdx = -1;
function wireSuggest(inputId, boxId) {
  const input = $(inputId), box = $(boxId);
  const hide = () => { box.style.display = "none"; box.innerHTML = ""; sugIdx = -1; };
  const show = (items) => {
    box.innerHTML = items.map(s => `<div role="option">${esc(s)}</div>`).join("");
    [...box.children].forEach((el, i) => {
      el.onmousedown = (e) => { e.preventDefault(); doSearch(el.textContent, state.type); hide(); };
    });
    box.style.display = "block";
  };
  input.addEventListener("input", () => {
    clearTimeout(sugTimer);
    const q = input.value.trim();
    if (q.length < 2) { hide(); return; }
    sugTimer = setTimeout(async () => {
      const r = await fetch(`/api/suggest?q=${encodeURIComponent(q)}`).then(x => x.json()).catch(() => null);
      if (r && r.suggestions.length) show(r.suggestions); else hide();
    }, 300);
  });
  input.addEventListener("keydown", (e) => {
    const items = [...box.children];
    if (e.key === "ArrowDown" && items.length) sugIdx = Math.min(sugIdx + 1, items.length - 1);
    else if (e.key === "ArrowUp" && items.length) sugIdx = Math.max(sugIdx - 1, -1);
    else if (e.key === "Enter") {
      if (sugIdx >= 0 && items[sugIdx]) { e.preventDefault(); doSearch(items[sugIdx].textContent, state.type); hide(); }
      else doSearch(input.value, state.type);
      return;
    } else if (e.key === "Escape") { hide(); return; }
    else return;
    e.preventDefault();
    items.forEach((el, i) => el.classList.toggle("active", i === sugIdx));
    if (sugIdx >= 0) input.value = items[sugIdx].textContent;
  });
  input.addEventListener("blur", () => setTimeout(hide, 150));
}

/* ---------- global shortcuts ---------- */
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
    e.preventDefault();
    ($("landing").style.display !== "none" ? $("q1") : $("q2")).focus();
  }
  if (e.key === "Escape") closeLightbox();
});

/* ---------- crawl admin ---------- */
$("maxPages").addEventListener("input", () => $("maxVal").textContent = $("maxPages").value);
$("crawlBtn").addEventListener("click", async () => {
  const seeds = $("seeds").value.split("\n").map(s => s.trim()).filter(Boolean);
  if (!seeds.length) { $("crawlStatus").textContent = "enter at least one URL"; return; }
  $("crawlBtn").disabled = true;
  $("crawlStatus").textContent = "haunting the web… this can take a while";
  try {
    const r = await fetch("/api/crawl", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        seeds, max_pages: +$("maxPages").value,
        allow_external: $("allowExternal").checked, refresh: $("forceRefresh").checked,
      }),
    }).then(r => r.json());
    if (r.detail) $("crawlStatus").textContent = `error: ${r.detail}`;
    else {
      $("crawlStatus").textContent =
        `done: ${r.crawled} crawled · ${r.duplicates} dupes · ${r.not_modified} unchanged · ${r.indexed} indexed`;
      loadStats();
    }
  } catch { $("crawlStatus").textContent = "crawl request failed"; }
  $("crawlBtn").disabled = false;
});

/* ---------- wiring ---------- */
$("go1").onclick = () => doSearch($("q1").value, state.type);
$("go2").onclick = () => doSearch($("q2").value, state.type);
wireSuggest("q1", "sug1");
wireSuggest("q2", "sug2");
loadStats();
</script>
